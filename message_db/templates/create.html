{% extends "base.html" %}
{% load group_tags %}
{% load static %}

{% block content %}

Please leave a message:
{% if user.is_staff %}
        <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <p>
                <label for="Recipient:">Select a recipient:</label>
                <input type="text" id="recipient" name="recipient" placeholder="Select a recipient"></p>
                <p>
                <label for="topic">Select a topic:</label>
                <input type="text" id="topic" name="topic" placeholder="Select a topic"></p>
                <label for="message">Send a message to staff:</label>
                <textarea name=" message" placeholder="Add a message" style="width:100%;height: 100px"></textarea>
                <button type="submit">Send</button>
        </form>
{% else %}
        <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <p>
                <label for="topic">Select a topic:</label>
                <input type="text" id="topic" name="topic" placeholder="Select a topic"></p>
                <label for="message">Send a message to staff:</label>
                <textarea name=" message" placeholder="Add a message" style="width:100%;height: 100px"></textarea>
                <button type="submit">Send</button>
        </form>
{% endif %}
{% endblock %}
